{% set name = "mac_alias" %}
{% set version = "2.2.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mac_alias-{{ version }}.tar.gz
  sha256: 1c7fa367687d66979f2ce4d1a8b2716cf1c9fb811741cab3cf3ca356555c2beb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - pytest
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - mac_alias
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://alastairs-place.net/projects/mac_alias
  doc_url: https://mac-alias.readthedocs.io/en/latest/
  summary: Generate and parse Mac OS Alias records from Python
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - thewchan
