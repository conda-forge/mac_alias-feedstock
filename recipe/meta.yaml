{% set name = "mac_alias" %}
{% set version = "2.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/mac_alias-{{ version }}.tar.gz
  sha256: a505a1d3f5b7c0919db7b9a49bcc0d0bad2575189034206ac2ec722b9acd3999

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - pytest
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - mac_alias
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://alastairs-place.net/projects/mac_alias
  doc_url: https://mac-alias.readthedocs.io/en/latest/
  summary: Generate and parse Mac OS Alias records from Python
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - thewchan
